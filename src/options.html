<!doctype html>
<meta charset="utf-8" />
<title>MapleScore</title>
<meta name="color-scheme" content="light dark" />
<style>
  :root {
    --paper: #fbf5ea;
    --paper-2: #f3e9d7;
    --ink: #2a1f1b;
    --muted: #8a7468;
    --line: #e2d3bd;
    --well: #efe3cf;
    --thumb: #c8201a;
    --thumb-2: #a8160f;
    --on-thumb: #fff8ee;
    --glow: rgba(200, 32, 26, 0.16);
    --leaf: rgba(200, 32, 26, 0.09);
    --display: ui-rounded, "SF Pro Rounded", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    color-scheme: light dark;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17110f;
      --paper-2: #211815;
      --ink: #f6ebdd;
      --muted: #a38d80;
      --line: #35261f;
      --well: #100b0a;
      --thumb: #ef4638;
      --thumb-2: #cf3025;
      --on-thumb: #1a0f0c;
      --glow: rgba(239, 70, 56, 0.28);
      --leaf: rgba(239, 70, 56, 0.1);
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  /* fixed width keeps the toolbar popup compact without horizontal scroll */
  body {
    position: relative;
    margin: 0;
    padding: 18px 18px 20px;
    width: 280px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(120% 60% at 50% -10%, var(--glow), transparent 70%),
      linear-gradient(var(--paper), var(--paper-2));
  }
  .watermark {
    position: absolute;
    top: -34px;
    right: -38px;
    width: 170px;
    height: 170px;
    color: var(--leaf);
    transform: rotate(14deg);
    pointer-events: none;
  }
  header, main { position: relative; }
  header { display: flex; align-items: center; gap: 8px; }
  .mark { width: 16px; height: 16px; color: var(--thumb); flex: none; }
  h1 {
    margin: 0;
    font: 700 15px/1 var(--display);
    letter-spacing: 0.01em;
  }
  .eyebrow, .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow { margin-left: auto; }
  .hero {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin: 18px 0 4px;
    padding-top: 6px;
  }
  #current {
    min-width: 2ch;
    text-align: center;
    white-space: nowrap;
    font: 800 88px/0.9 var(--display);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.06em;
    color: var(--thumb);
    text-shadow: 0 6px 26px var(--glow);
  }
  .unit {
    font: 700 13px/1 var(--display);
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .label { display: block; text-align: center; margin-bottom: 14px; }
  .dial {
    position: relative;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 4px;
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.18), 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .thumb {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 7);
    border-radius: 999px;
    background: linear-gradient(var(--thumb), var(--thumb-2));
    box-shadow: 0 3px 10px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transform: translateX(calc(var(--i, 3) * 100%));
    transition: transform 0.28s cubic-bezier(0.3, 1.4, 0.5, 1);
    pointer-events: none;
  }
  .dial button {
    position: relative;
    z-index: 1;
    height: 32px;
    padding: 0;
    font: 700 14px/1 var(--display);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s, transform 0.1s;
  }
  .dial button:hover { color: var(--ink); }
  .dial button:active { transform: scale(0.88); }
  .dial button[aria-checked="true"] { color: var(--on-thumb); }
  .dial button.key::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 3px;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--thumb);
    opacity: 0.5;
    pointer-events: none;
  }
  .dial button.key[aria-checked="true"]::after { background: var(--on-thumb); opacity: 0.7; }
  .dial button:focus-visible, #allow:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  #access {
    margin-top: 16px;
    padding: 12px;
    background: var(--well);
    border: 1px dashed var(--thumb);
    border-radius: 14px;
  }
  #access p { margin: 0; font-size: 12px; color: var(--muted); }
  #allow {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 9px 14px;
    font: 700 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--on-thumb);
    background: linear-gradient(var(--thumb), var(--thumb-2));
    border: 0;
    border-radius: 999px;
    box-shadow: 0 3px 10px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  #allow:hover { filter: brightness(1.08); }
  #allow:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
<svg class="watermark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
  <path d="M50 3 L58 21 L70 15 L67 40 L88 29 L82 50 L97 54 L78 70 L82 79 L54 74 L54 97 L46 97 L46 74 L18 79 L22 70 L3 54 L18 50 L12 29 L33 40 L30 15 L42 21 Z" />
</svg>
<header>
  <svg class="mark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
    <path d="M50 3 L58 21 L70 15 L67 40 L88 29 L82 50 L97 54 L78 70 L82 79 L54 74 L54 97 L46 97 L46 74 L18 79 L22 70 L3 54 L18 50 L12 29 L33 40 L30 15 L42 21 Z" />
  </svg>
  <h1>MapleScore</h1>
  <span class="eyebrow">TCF Canada</span>
</header>
<main>
  <div class="hero">
    <span id="current" aria-live="polite"></span>
    <span class="unit" aria-hidden="true">NCLC</span>
  </div>
  <span class="label" id="lbl">Target level</span>
  <div class="dial" id="seg" role="radiogroup" aria-labelledby="lbl">
    <div class="thumb" id="thumb" aria-hidden="true"></div>
  </div>
  <section id="access" hidden>
    <p>Needed to add the NCLC column on the results page.</p>
    <button type="button" id="allow"
      title="Allow on https://tcfcandidat.france-education-international.fr/*"
      aria-label="Allow on https://tcfcandidat.france-education-international.fr/*">Allow on TCF Candidat</button>
  </section>
</main>
<script src="options.js"></script>
